id: org.mindworkai.AIStudio
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: mind-work-ai-studio
add-extensions:
  org.mindworkai.AIStudio.plugin:
    version: '1'
    directory: plugins
    subdirectories: true
    no-autodownload: true
    autodelete: true
  org.mindworkai.AIStudio.provisioning:
    directory: etc/MindWorkAI
    no-autodownload: true
finish-args:
  - --env=no_proxy=localhost,127.0.0.1
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=home:ro
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.keyring.SystemPrompter
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/plugins
  - mkdir -p ${FLATPAK_DEST}/etc/MindWorkAI
modules:
  # AI Studio builds with the Rust toolchain which line 6 of its metadata.txt names, like all its other
  # builds: the Rust extension of Flathub often lags behind by several versions. update-dependencies writes
  # the archives of that toolchain. Only the build needs it, so the cleanup removes all of it again.
  - name: rust-toolchain
    buildsystem: simple
    cleanup:
      - '*'
    build-options:
      no-debuginfo: true
      arch:
        x86_64:
          env:
            RUST_TARGET: x86_64-unknown-linux-gnu
        aarch64:
          env:
            RUST_TARGET: aarch64-unknown-linux-gnu
    build-commands:
      - ./install.sh --prefix=/app/lib/rust-toolchain --components=rustc,cargo,rust-std-${RUST_TARGET} --disable-ldconfig
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://static.rust-lang.org/dist/2026-10-15/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
      - type: archive
        only-arches: [aarch64]
        url: https://static.rust-lang.org/dist/2026-10-15/rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
        sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
  # The Tauri CLI is needed only to build AI Studio. Nothing it installs belongs in the app,
  # so the cleanup removes all of it: cargo-tauri as well as the metadata of cargo install.
  - name: tauri-cli
    buildsystem: simple
    cleanup:
      - '*'
    build-options:
      append-path: /app/lib/rust-toolchain/bin
      env:
        CARGO_HOME: /run/build/tauri-cli/cargo
    build-commands:
      - cargo install --path crates/tauri-cli --root /app --offline --locked
    sources:
      - type: git
        url: https://github.com/tauri-apps/tauri
        tag: tauri-cli-v2.12.6
      - 'tauri-cli-sources.json'
  - name: mind-work-ai-studio
    buildsystem: simple
    build-options:
      append-path: /app/lib/rust-toolchain/bin
      prepend-path: '/usr/lib/sdk/dotnet10/bin'
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
      env:
        CARGO_HOME: /run/build/mind-work-ai-studio/cargo
        CARGO_NET_OFFLINE: 'true'
        RestoreAdditionalProjectSources: "/run/build/mind-work-ai-studio/nuget-sources;/usr/lib/sdk/dotnet10/nuget/packages"
    sources:
      - type: git
        url: https://github.com/MindWorkAI/AI-Studio
        tag: v26.11.1
        commit: 520758771b40b21796a1b1ef9f811b2f6484ef0e
        x-checker-data:
          type: git
          tag-pattern: ^(v[0-9]+\.[0-9]+\.[0-9]+)$
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7763/pdfium-linux-x64.tgz
        sha256: e3f0c66b2daad710cb6c8edd4a8c45c8902995e359dc0775917fc16e2e56349d
        dest: pdfium-tmp
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7763/pdfium-linux-arm64.tgz
        sha256: 1518d09bbf09a1bef27a6f93656d95b55bd22bcaecda597679e05f4e82c5fbfa
        dest: pdfium-tmp
      - 'dotnet-sources.json'
      - 'cargo-sources.json'
    build-commands:
      - mkdir -p runtime/resources/libraries
      - cp pdfium-tmp/libpdfium.so runtime/resources/libraries/libpdfium.so
      - cargo --offline fetch --manifest-path runtime/Cargo.toml --verbose
      - 'cd app/Build; dotnet run build --offline --skip-verify'
      - install -Dm755 runtime/target/release/mindworkAIStudioServer /app/bin/mindworkAIStudioServer
      - install -Dm755 runtime/target/release/MindWork\ AI\ Studio /app/bin/mind-work-ai-studio
      - install -Dm644 runtime/target/release/resources/libraries/libpdfium.so /app/lib/libpdfium.so
      # Tauri looks for the app's resources in <exe dir>/../lib/<productName> first, i.e., in
      # /app/lib/MindWork AI Studio. Without that directory, it falls back to /usr/lib/MindWork AI Studio,
      # which does not exist inside the Flatpak.
      - install -Dm644 runtime/resources/tokenizers/tokenizer.json /app/lib/MindWork\ AI\ Studio/resources/tokenizers/tokenizer.json
      - install -Dm644 runtime/resources/notices/THIRD_PARTY_MEDIA_NOTICES.md /app/lib/MindWork\ AI\ Studio/resources/notices/THIRD_PARTY_MEDIA_NOTICES.md
      - install -Dm644 runtime/packaging/linux/org.mindworkai.AIStudio.desktop /app/share/applications/org.mindworkai.AIStudio.desktop
      - install -Dm644 runtime/packaging/linux/org.mindworkai.AIStudio.metainfo.xml /app/share/metainfo/org.mindworkai.AIStudio.metainfo.xml
      - install -Dm644 runtime/icons/icon.png /app/share/icons/hicolor/512x512/apps/org.mindworkai.AIStudio.png
