id: org.mindworkai.AIStudio.plugin.pandoc
runtime: org.mindworkai.AIStudio
runtime-version: 'stable'
branch: "1"

sdk: org.freedesktop.Sdk//25.08

build-extension: true
separate-locales: false

command: pandoc

build-options:
  prefix: /app/plugins/pandoc
  prepend-path: /app/plugins/pandoc

modules:
  - name: pandoc
    buildsystem: simple

    build-commands:
      - install -Dm0644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0766 pandoc-tmp/bin/pandoc ${FLATPAK_DEST}/bin/pandoc

    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/jgm/pandoc/releases/download/3.14/pandoc-3.14-linux-amd64.tar.gz
        sha256: c5f4720cdefb3f7bdc5d07202ef579feef0d1370773c873804dd8fdaa8c4f1b8
        dest: pandoc-tmp
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/jgm/pandoc/releases/download/3.14/pandoc-3.14-linux-arm64.tar.gz
        sha256: c692f3d78a415741bbbac4cdbbbe26fa7edca1f43d2301b982fbf4009cc8cf7f
        dest: pandoc-tmp
      - type: file
        path: org.mindworkai.AIStudio.plugin.pandoc.metainfo.xml
